<head>

        h1, h2 {
            font-family: Arial, sans-serif;
            text-align: center;
            color: DarkRed; /* Format warna: nama warna */
        }

        /* Styling dasar halaman */
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9; /* Format warna: HEX */
